<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Login - The Posture Lab</title>
  </head>
  <body>
    <div class="landing-page">
      <div class="div">
        <!-- NAVBAR -->
        <div class="navbar">
          <div class="frame-16">
            <p class="the-posture-lab">
              <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
            </p>
            <div class="frame-17">
              <a href="index.html" class="text-wrapper-26">Home</a>
              <a href="login.html" class="text-wrapper-26">Login</a>
              <a href="index.html" class="text-wrapper-26">Configurações</a>
            </div>
          </div>
        </div>

        <!-- CONTEÚDO LOGIN -->
        <div class="login-section">
          <div class="login-box">
            <div class="input-section">
              <label for="identificador" class="label-identificador">Identificador</label>
              <div class="input-wrapper">
                <img src="img/icon.png" alt="Ícone usuário" class="input-icon" />
                <div class="input-line">
                  <input type="text" id="identificador" name="identificador" />
                </div>
              </div>
            </div>
            
            <!-- BOTÃO COM REDIRECIONAMENTO -->
            <a href="poslogin.html">
              <button class="login-button">LOGIN</button>
            </a>
          </div>
        </div>

        <!-- IMAGEM NO CANTO INFERIOR ESQUERDO -->
        <img src="img/Group 6.png" alt="Decoração" class="corner-image" />
      </div>
    </div>
  </body>
</html>
