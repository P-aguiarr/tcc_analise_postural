<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/style.css" />
  <title>Login - The Posture Lab</title>

  <!-- Script da Google Identity Services para SSO (CRÍTICO: mantido no head) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<!-- A função checkUserAndRedirect é mantida para verificar login existente -->
<body onload="checkUserAndRedirect()"> 
  <div class="landing-page">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/configuracoes" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

    <!-- CONTEÚDO LOGIN -->
    <div class="login-section">
      <p class="central-login">
        Entre na plataforma e descubra um mundo de possibilidades!
      </p>

      <!-- Container para o botão do Google (Com lógica de imagem customizada) -->
      <div class="google-login-container">
        
        <!-- 1. IMAGEM CUSTOMIZADA QUE O USUÁRIO CLICA -->
        <div id="customGoogleButton" 
             style="cursor: pointer; display: inline-block;" 
             onclick="triggerGoogleSignIn()">
          <img src="/img/google.png" alt="Login com Google" class="google-login-img" />
        </div>
        
        <!-- 2. BOTÃO OFICIAL GSI (ESCONDIDO) PARA ACIONAR O FLUXO -->
        <div id="g_id_onload"
             data-client_id="584796181991-rs0d2u96o5q6e4jcgr84itrks0d7297r.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             style="display: none; visibility: hidden;"> 
             <!-- O ID CRÍTICO AQUI é 'g_id_onload'. O GSI renderiza um botão interno com ID 'gsi-button' aqui. -->
        </div>

      </div>

      <!-- Área de Feedback -->
      <div id="loadingSpinner" class="loading-spinner" style="display: none;"></div>
      <div id="errorDetails" class="error-message" style="display: none;"></div>
      <div id="successMessage" class="success-message" style="display: none;">Login bem-sucedido! Redirecionando...</div>

      <!-- Botão de Debug/Teste (REMOVIDO conforme solicitação) -->
      <div class="debug-area">
        <!-- O botão de teste "Testar Conexão Railway API" foi removido. -->
      </div>

    </div>
  </div>

  <script>
    // **CRÍTICO: URL BASE DA API DE ANÁLISE (RAILWAY) - Agora é o endpoint de callback também**
    // Se o frontend e o backend estiverem no mesmo domínio, pode-se usar /api/callback
    // Se estiverem em domínios diferentes (como Railway/Vercel), DEVE ser o endereço completo do backend.
    // Usando a URL base para manter a configuração anterior, o callback será RAILWAY_API_BASE_URL + /api/callback
    const RAILWAY_API_BASE_URL = 'https://tccanalisepostural-production.up.railway.app';
    
    // ==========================================================
    // FUNÇÕES DE EXIBIÇÃO
    // ==========================================================
    function showLoading() {
      document.getElementById('loadingSpinner').style.display = 'block';
      hideError();
      hideSuccess();
    }

    function hideLoading() {
      document.getElementById('loadingSpinner').style.display = 'none';
    }

    function showError(message) {
      const errorElement = document.getElementById('errorDetails');
      errorElement.innerText = '❌ Erro: ' + message;
      errorElement.style.display = 'block';
      hideLoading();
      document.getElementById('successMessage').style.display = 'none';
    }

    function hideError() {
      document.getElementById('errorDetails').style.display = 'none';
    }
    
    function showSuccess(message) {
      const successElement = document.getElementById('successMessage');
      successElement.innerText = message;
      successElement.style.display = 'block';
      hideLoading();
      document.getElementById('errorDetails').style.display = 'none';
    }
    
    function hideSuccess() {
      document.getElementById('successMessage').style.display = 'none';
    }

    // ==========================================================
    // LÓGICA DE CLIQUE CUSTOMIZADO (AGORA USANDO MUTATIONOBSERVER)
    // ==========================================================
    function triggerGoogleSignIn() {
        showLoading();
        
        // O Google injeta um botão 'gsi-button' dentro do container 'g_id_onload'
        const gsiButton = document.getElementById('gsi-button');
        
        if (gsiButton) {
            // Se o botão já estiver no DOM (carregamento rápido)
            console.log('✅ Botão GSI encontrado imediatamente. Simulando clique.');
            gsiButton.click();
            return;
        }

        console.log('⏳ Botão GSI não encontrado. Observando o DOM para carregamento do Google...');

        const targetNode = document.getElementById('g_id_onload');
        if (!targetNode) {
            console.error('❌ Container g_id_onload não encontrado. Estrutura HTML incorreta.');
            showError('Erro interno: Container de login do Google não encontrado.');
            return;
        }

        // Configurações e Callback do MutationObserver para esperar o botão do GSI ser injetado
        const config = { childList: true, subtree: true };
        const observer = new MutationObserver(function(mutationsList, observer) {
            const loadedButton = document.getElementById('gsi-button');
            
            if (loadedButton) {
                observer.disconnect(); // Parar de observar
                console.log('✅ MutationObserver: Botão GSI detectado e pronto. Simulando clique.');
                loadedButton.click();
            }
        });

        observer.observe(targetNode, config);
        
        // Configurar um timeout de fallback, caso algo trave
        setTimeout(() => {
            if (observer) {
                observer.disconnect();
                const finalCheck = document.getElementById('gsi-button');
                if (!finalCheck) {
                    console.error('❌ Observer: Falha ao carregar botão GSI após timeout de 5s.');
                    showError('O serviço de login do Google falhou ao carregar. Tente recarregar.');
                }
            }
        }, 5000); // 5 segundos de timeout para fallback
    }


    // ==========================================================
    // REDIRECIONAMENTO DE PRÉ-LOGIN
    // ==========================================================
    function checkUserAndRedirect() {
      const userJSON = localStorage.getItem('user');
      const loginTime = localStorage.getItem('loginTime');

      if (userJSON && loginTime) {
        try {
          const userData = JSON.parse(userJSON);
          const currentTime = new Date().getTime();
          const EXPIRATION_TIME_MS = 86400000; // 24 horas

          if (currentTime - parseInt(loginTime) < EXPIRATION_TIME_MS) {
            console.log('Usuário válido encontrado. Redirecionando...');
            showSuccess(`Bem-vindo de volta, ${userData.name.split(' ')[0]}! Redirecionando...`);
            setTimeout(() => {
              window.location.href = '/poslogin';
            }, 1000); 
            return true;
          } else {
            console.log('Login expirado. Favor logar novamente.');
            localStorage.removeItem('user');
            localStorage.removeItem('loginTime');
          }
        } catch (e) {
          console.error('Erro ao parsear dados de usuário do localStorage:', e);
          localStorage.removeItem('user');
          localStorage.removeItem('loginTime');
        }
      }
      return false;
    }
    
    // ==========================================================
    // FUNÇÃO PRINCIPAL DE RESPOSTA DO GOOGLE (CHAMA O CALLBACK DO FLASK)
    // ==========================================================
    async function handleCredentialResponse(response) {
      if (!response.credential) {
        showError('Falha ao receber a credencial do Google.');
        return;
      }
      
      showLoading();

      try {
        // CHAMA A NOVA ROTA DE CALLBACK NO SEU BACKEND FLASK (app.py)
        const apiResponse = await fetch(`${RAILWAY_API_BASE_URL}/api/callback`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id_token: response.credential }) // Enviamos o token ID
        });

        const data = await apiResponse.json();

        if (apiResponse.ok && data.success) {
          // O backend retornou os dados do usuário
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('loginTime', new Date().getTime().toString());
          
          console.log('✅ Login completo. Dados salvos:', data.user);
          showSuccess(`Login bem-sucedido! Bem-vindo(a), ${data.user.name.split(' ')[0]}. Redirecionando...`);
          
          setTimeout(() => {
            window.location.href = '/poslogin';
          }, 1500); 

        } else {
          // Se o backend falhar na validação do token
          const errorMessage = data.error || 'Erro desconhecido ao processar o login.';
          console.error('❌ Erro na API de Callback:', data.error, data.details);
          showError(errorMessage);
        }

      } catch (error) {
        console.error('❌ Erro ao comunicar com o servidor de callback:', error);
        showError('Não foi possível se conectar com o servidor para finalizar o login.');
      } finally {
        hideLoading();
      }
    }


    // Expor funções para console
    window.handleCredentialResponse = handleCredentialResponse;
    window.checkUserAndRedirect = checkUserAndRedirect;
    window.triggerGoogleSignIn = triggerGoogleSignIn;
  </script>
</body>
</html>
