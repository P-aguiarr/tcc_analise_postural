<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/site/globals.css" />
  <link rel="stylesheet" href="/site/styleguide.css" />
  <link rel="stylesheet" href="/site/style.css" />
  <title>Login - The Posture Lab</title>
  <style>
    /* Seção centralizada */
    .login-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 160px); /* Ajusta altura considerando navbar e footer */
      text-align: center;
      padding: 20px;
    }

    /* Frase central com largura maior e fonte grande */
    .landing-page .central-login {
      position: relative;
      width: 720px;
      font-family: "Manrope-Regular", Helvetica, sans-serif;
      font-weight: 700; /* negrito */
      color: var(--black, #000);
      font-size: 40px;
      letter-spacing: 0.25px;
      line-height: 48px;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* Botão Google */
    .google-login-img {
      width: 277px;
      height: 80px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .google-login-img:hover {
      transform: scale(1.05);
    }

    /* Navbar fixa no topo */
    .navbar {
      background: #fff;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .frame-17 a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }

    /* Imagem no canto inferior esquerdo */
    .corner-image {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 100px;
      opacity: 0.8;
      z-index: -1;
    }

    /* FOOTER COM O PADRÃO SOLICITADO */
    .footer {
      text-align: center;
      font-family: "Manrope-Regular", Helvetica, sans-serif;
      color: #333;
      padding: 20px 0;
      width: 100%;
      position: relative;
      bottom: 0;
    }

    .footer-links {
      margin-bottom: 0.8rem;
    }
        
    .footer-links a {
      color: #718096;
      text-decoration: none;
      margin: 0 0.8rem;
      font-size: 0.9rem;
    }
    
    .footer-links a:hover {
      color: #4e73df;
      text-decoration: underline;
    }

    .copyright {
      font-weight: 500;
      font-size: 0.9rem;
      color: #718096;
    }

    /* Loading spinner */
    .loading {
      display: none;
      margin-top: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4285F4;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsivo: reduzir largura em telas menores */
    @media (max-width: 800px) {
      .landing-page .central-login {
        width: 90%;
        font-size: 32px;
        line-height: 40px;
      }
    }

    @media (max-width: 500px) {
      .landing-page .central-login {
        font-size: 24px;
        line-height: 32px;
      }
      
      .footer-links a {
        display: block;
        margin: 0.5rem 0;
      }
    }
  </style>
</head>
<body>
  <div class="landing-page">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="index.html" class="text-wrapper-26">Home</a>
          <a href="login.html" class="text-wrapper-26">Login</a>
          <a href="index.html" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

    <!-- CONTEÚDO LOGIN -->
    <div class="login-section">
      <p class="central-login">
        Entre na plataforma e descubra um mundo de possibilidades!
      </p>
      
      <!-- Botão de Login com Google -->
      <div id="googleLogin" style="cursor: pointer; display: inline-block;">
        <img src="/site/img/google.png" alt="Login com Google" class="google-login-img" />
      </div>
      
      <!-- Loading spinner -->
      <div class="loading" id="loadingSpinner">
        <div class="spinner"></div>
        <p>Processando login...</p>
      </div>
    </div>
    
    <!-- IMAGEM DECORATIVA -->
    <img src="/site/img/Group 6.png" alt="Decoração" class="corner-image" />

    <!-- FOOTER COM O PADRÃO SOLICITADO -->
    <div class="footer">
      <div class="footer-links">
        <a href="#">Careers</a> | 
        <a href="#">Privacy Policy</a> | 
        <a href="#">Terms & Conditions</a>
      </div>
      <div class="copyright">
        © 2025 Analíse Postural 
      </div>
    </div>
  </div>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <script>
    // Configuração do Google Sign-In
    window.onload = function () {
      // Inicializar o Google Sign-In
      google.accounts.id.initialize({
        client_id: '584796181991-rs0d2u96o5q6e4jcgr84itrks0d7297r.apps.googleusercontent.com',
        callback: handleGoogleSignIn
      });
      
      // Adicionar evento de clique à imagem do Google
      document.getElementById('googleLogin').addEventListener('click', function() {
        // Mostrar loading
        document.getElementById('loadingSpinner').style.display = 'block';
        
        // Solicitar login com Google
        google.accounts.id.prompt();
      });
    };

    // Função para lidar com a resposta do Google
    function handleGoogleSignIn(response) {
      // Esconder loading
      document.getElementById('loadingSpinner').style.display = 'none';
      
      // Enviar o token para nossa API route no Vercel
      fetch('https://ttc-analise-postural.vercel.app/api/auth/callback', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token: response.credential })
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('Erro na resposta do servidor');
        }
        return response.json();
      })
      .then(data => {
        if (data.success) {
          // Salvar informações do usuário no localStorage
          localStorage.setItem('user', JSON.stringify(data.user));
          localStorage.setItem('userId', data.user.id);
          
          // Redirecionar para a página principal
          window.location.href = '/site/dashboard.html';
        } else {
          alert('Erro no login: ' + (data.error || 'Erro desconhecido'));
        }
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro ao fazer login. Por favor, tente novamente.');
      });
    }
  </script>
</body>
</html>
