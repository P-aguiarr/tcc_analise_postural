<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Análise Avançado - The Posture Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js e plugin para Box Plot -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/chartjs-chart-box-and-violin-plot/build/Chart.BoxPlot.js"></script>
    <!-- Ícones (Lucide) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #1f2937;
            --light: #f3f4f6;
            --dark: #111827;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
        }
        .chart-container {
            position: relative;
            height: 350px;
            width: 100%;
        }
        .metric-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .tab-button {
            transition: all 0.3s;
        }
        .tab-button.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Container Principal -->
    <div class="max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Cabeçalho -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard de Análise Postural</h1>
            <p class="text-gray-500 mt-1" id="analysisSubtitle">Análise de Demonstração - 13/10/2025</p>
        </header>

        <!-- Seção de Métricas Principais (sem alterações) -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="metric-card bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500 transition-all">
                <div class="flex items-center justify-between"><h3 class="text-gray-500 font-medium">Pontuação Geral</h3><div class="p-2 bg-indigo-100 rounded-full"><i data-lucide="award" class="text-indigo-500"></i></div></div><p class="text-4xl font-bold mt-2" id="scoreGeral">82 <span class="text-2xl text-gray-400">/ 100</span></p>
            </div>
            <div class="metric-card bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500 transition-all">
                <div class="flex items-center justify-between"><h3 class="text-gray-500 font-medium">Nível de Simetria</h3><div class="p-2 bg-green-100 rounded-full"><i data-lucide="scale" class="text-green-500"></i></div></div><p class="text-4xl font-bold mt-2" id="scoreSimetria">88%</p>
            </div>
            <div class="metric-card bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 transition-all">
                <div class="flex items-center justify-between"><h3 class="text-gray-500 font-medium">Qualidade da Marcha</h3><div class="p-2 bg-blue-100 rounded-full"><i data-lucide="footprints" class="text-blue-500"></i></div></div><p class="text-4xl font-bold mt-2" id="scoreMarcha">75%</p>
            </div>
            <div class="metric-card bg-white p-6 rounded-xl shadow-sm border-l-4 border-orange-500 transition-all">
                <div class="flex items-center justify-between"><h3 class="text-gray-500 font-medium">Estabilidade</h3><div class="p-2 bg-orange-100 rounded-full"><i data-lucide="anchor" class="text-orange-500"></i></div></div><p class="text-4xl font-bold mt-2" id="scoreEstabilidade">Médio</p>
            </div>
        </section>

        <!-- Abas de Navegação dos Gráficos -->
        <div class="bg-white rounded-xl shadow-sm p-2 mb-8">
            <nav id="tabs" class="flex flex-wrap items-center justify-center sm:justify-start space-x-2 sm:space-x-4">
                <button data-tab="angulos" class="tab-button active text-sm sm:text-base font-semibold py-3 px-4 border-b-2 border-transparent">Ângulos Articulares</button>
                <button data-tab="simetria" class="tab-button text-sm sm:text-base font-semibold py-3 px-4 border-b-2 border-transparent">Simetria Corporal</button>
                <button data-tab="temporal" class="tab-button text-sm sm:text-base font-semibold py-3 px-4 border-b-2 border-transparent">Análise Temporal</button>
                <button data-tab="distribuicoes" class="tab-button text-sm sm:text-base font-semibold py-3 px-4 border-b-2 border-transparent">Distribuições</button>
            </nav>
        </div>

        <!-- Conteúdo das Abas com Gráficos -->
        <main id="tab-content">
            <!-- Categoria: Ângulos Articulares -->
            <div id="angulos-content" class="tab-pane active grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Gráficos desta categoria serão inseridos aqui via JS -->
            </div>

            <!-- Categoria: Simetria Corporal -->
            <div id="simetria-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                <!-- Gráficos desta categoria serão inseridos aqui via JS -->
            </div>

            <!-- Categoria: Análise Temporal -->
            <div id="temporal-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                 <!-- Gráficos desta categoria serão inseridos aqui via JS -->
            </div>

            <!-- Categoria: Distribuições -->
            <div id="distribuicoes-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
                 <!-- Gráficos desta categoria serão inseridos aqui via JS -->
            </div>
        </main>

    </div>

    <script>
        let fullAnalysisData = null;

        // ===================================
        // HELPERS E FUNÇÕES UTILITÁRIAS
        // ===================================

        function generateDemoData(numPoints = 150) {
            const data = [];
            const timestamps = [];
            for (let i = 0; i < numPoints; i++) {
                const time = (i * 0.1).toFixed(1);
                timestamps.push(time);
                
                const sin = Math.sin(i / 10);
                const cos = Math.cos(i / 8);

                data.push({
                    "frame": i + 1, "tempo_segundos": parseFloat(time),
                    "angulo_ombro_esquerdo": 150 + sin * 10 + (Math.random() - 0.5) * 4,
                    "angulo_ombro_direito": 148 + sin * 10 + (Math.random() - 0.5) * 4,
                    "angulo_quadril_esquerdo": 160 + cos * 12 + (Math.random() - 0.5) * 5,
                    "angulo_quadril_direito": 163 + cos * 12 + (Math.random() - 0.5) * 5,
                    "angulo_joelho_esquerdo": 170 - cos * 15 + (Math.random() - 0.5) * 6,
                    "angulo_joelho_direito": 172 - cos * 15 + (Math.random() - 0.5) * 6,
                    "assimetria_ombros_metros": 0.015 + (Math.random() - 0.5) * 0.01,
                    "assimetria_quadris_metros": 0.020 + (Math.random() - 0.5) * 0.008,
                    "angulo_coluna_cervical": 170 + Math.sin(i / 15) * 5 + (Math.random() - 0.5) * 3,
                    "angulo_coluna_toracica": 175 + Math.cos(i / 12) * 3 + (Math.random() - 0.5) * 2,
                    "distancia_percorrida_metros": (i / numPoints) * 6,
                    "centro_quadril_y": 1.2 + sin * 0.05 + (Math.random() - 0.5) * 0.02
                });
            }
            return { timestamps, data };
        }

        function exportToCSV(data, filename) {
            if (!data || data.length === 0) { alert("Não há dados para exportar."); return; }
            const headers = Object.keys(data[0]);
            const csvRows = [headers.join(',')];
            for (const row of data) {
                const values = headers.map(header => `"${('' + row[header]).replace(/"/g, '\\"')}"`);
                csvRows.push(values.join(','));
            }
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' }));
            link.setAttribute('download', filename);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        // Função para criar a estrutura de um card de gráfico
        function createChartCard(id, title, category) {
            const container = document.getElementById(`${category}-content`);
            const card = document.createElement('div');
            card.className = 'bg-white p-6 rounded-xl shadow-sm';
            card.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4">
                    <h2 class="text-lg font-bold">${title}</h2>
                    <button id="export-${id}" class="mt-2 sm:mt-0 text-sm flex items-center gap-2 px-3 py-1.5 rounded-md font-semibold bg-gray-100 text-gray-600 hover:bg-gray-200 transition-all">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        Exportar CSV
                    </button>
                </div>
                <div class="chart-container">
                    <canvas id="${id}"></canvas>
                </div>
            `;
            container.appendChild(card);
        }

        // ===================================
        // FUNÇÕES DE CRIAÇÃO DE GRÁFICOS
        // ===================================
        
        function setupAllCharts(timestamps, data) {
            const chartOptions = (yBeginAtZero = false) => ({
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: { x: { grid: { display: false } }, y: { beginAtZero: yBeginAtZero, grid: { color: '#e5e7eb' } } },
                plugins: { legend: { position: 'top' }, tooltip: { backgroundColor: 'rgba(0,0,0,0.8)' } },
                elements: { point: { radius: 0, hoverRadius: 5 }, line: { tension: 0.3, borderWidth: 2 } }
            });

            // --- Ângulos Articulares ---
            createChartCard('chartOmbros', 'Ângulos dos Ombros', 'angulos');
            new Chart('chartOmbros', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Ombro Esquerdo', data: data.map(d => d.angulo_ombro_esquerdo), borderColor: '#4f46e5' }, { label: 'Ombro Direito', data: data.map(d => d.angulo_ombro_direito), borderColor: '#3b82f6', borderDash: [5, 5] } ] }, options: chartOptions() });
            document.getElementById('export-chartOmbros').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, ombro_esq: d.angulo_ombro_esquerdo, ombro_dir: d.angulo_ombro_direito })), 'angulos_ombros.csv');

            createChartCard('chartQuadris', 'Ângulos dos Quadris', 'angulos');
            new Chart('chartQuadris', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Quadril Esquerdo', data: data.map(d => d.angulo_quadril_esquerdo), borderColor: '#10b981' }, { label: 'Quadril Direito', data: data.map(d => d.angulo_quadril_direito), borderColor: '#65a30d', borderDash: [5, 5] } ] }, options: chartOptions() });
            document.getElementById('export-chartQuadris').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, quadril_esq: d.angulo_quadril_esquerdo, quadril_dir: d.angulo_quadril_direito })), 'angulos_quadris.csv');

            createChartCard('chartColuna', 'Ângulos da Coluna', 'angulos');
            new Chart('chartColuna', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Coluna Cervical', data: data.map(d => d.angulo_coluna_cervical), borderColor: '#8b5cf6' }, { label: 'Coluna Torácica', data: data.map(d => d.angulo_coluna_toracica), borderColor: '#d946ef' } ] }, options: chartOptions() });
            document.getElementById('export-chartColuna').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, cervical: d.angulo_coluna_cervical, toracica: d.angulo_coluna_toracica })), 'angulos_coluna.csv');
            
            createChartCard('chartJoelhos', 'Ângulos dos Joelhos', 'angulos');
            new Chart('chartJoelhos', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Joelho Esquerdo', data: data.map(d => d.angulo_joelho_esquerdo), borderColor: '#f97316' }, { label: 'Joelho Direito', data: data.map(d => d.angulo_joelho_direito), borderColor: '#f59e0b', borderDash: [5, 5] } ] }, options: chartOptions() });
            document.getElementById('export-chartJoelhos').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, joelho_esq: d.angulo_joelho_esquerdo, joelho_dir: d.angulo_joelho_direito })), 'angulos_joelhos.csv');

            // --- Simetria Corporal ---
            createChartCard('chartAssimetria', 'Assimetrias Corporais', 'simetria');
            new Chart('chartAssimetria', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Assimetria Ombros (m)', data: data.map(d => d.assimetria_ombros_metros), borderColor: '#ef4444', fill: true, backgroundColor: '#ef444420' }, { label: 'Assimetria Quadris (m)', data: data.map(d => d.assimetria_quadris_metros), borderColor: '#f97316', fill: true, backgroundColor: '#f9731620' } ] }, options: chartOptions(true) });
            document.getElementById('export-chartAssimetria').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, assimetria_ombros: d.assimetria_ombros_metros, assimetria_quadris: d.assimetria_quadris_metros })), 'assimetrias_corporais.csv');
            
            createChartCard('chartComparacaoLados', 'Comparação Lado Esquerdo vs. Direito', 'simetria');
            new Chart('chartComparacaoLados', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Diferença Ombros (°)', data: data.map(d => Math.abs(d.angulo_ombro_esquerdo - d.angulo_ombro_direito)), borderColor: '#4f46e5' }, { label: 'Diferença Quadris (°)', data: data.map(d => Math.abs(d.angulo_quadril_esquerdo - d.angulo_quadril_direito)), borderColor: '#10b981' }, { label: 'Diferença Joelhos (°)', data: data.map(d => Math.abs(d.angulo_joelho_esquerdo - d.angulo_joelho_direito)), borderColor: '#f97316' } ] }, options: chartOptions(true) });
            document.getElementById('export-chartComparacaoLados').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, diff_ombros: Math.abs(d.angulo_ombro_esquerdo - d.angulo_ombro_direito), diff_quadris: Math.abs(d.angulo_quadril_esquerdo - d.angulo_quadril_direito), diff_joelhos: Math.abs(d.angulo_joelho_esquerdo - d.angulo_joelho_direito) })), 'comparacao_lados.csv');

            // --- Análise Temporal ---
            createChartCard('chartCarga', 'Distribuição de Carga (Vertical)', 'temporal');
            new Chart('chartCarga', { type: 'line', data: { labels: timestamps, datasets: [ { label: 'Oscilação Vertical do Quadril (m)', data: data.map(d => d.centro_quadril_y), borderColor: '#0ea5e9' } ] }, options: chartOptions() });
            document.getElementById('export-chartCarga').onclick = () => exportToCSV(data.map(d => ({ tempo: d.tempo_segundos, oscilacao_vertical_quadril: d.centro_quadril_y })), 'distribuicao_carga.csv');

            createChartCard('chartMarcha', 'Padrão de Marcha (Velocidade)', 'temporal');
            const speeds = data.slice(1).map((d, i) => Math.abs(d.distancia_percorrida_metros - data[i].distancia_percorrida_metros) / 0.1);
            new Chart('chartMarcha', { type: 'bar', data: { labels: timestamps.slice(1), datasets: [ { label: 'Velocidade (m/s)', data: speeds, backgroundColor: '#06b6d480' } ] }, options: chartOptions(true) });
            document.getElementById('export-chartMarcha').onclick = () => exportToCSV(speeds.map((s, i) => ({ tempo: data[i+1].tempo_segundos, velocidade_ms: s })), 'padrao_marcha_velocidade.csv');

            // --- Distribuições ---
            const boxplotData = {
                labels: ['Ombro Esq', 'Ombro Dir', 'Quadril Esq', 'Quadril Dir', 'Joelho Esq', 'Joelho Dir'],
                datasets: [{
                    label: 'Distribuição de Ângulos',
                    backgroundColor: '#10b98140', borderColor: '#10b981', borderWidth: 1,
                    padding: 10, itemRadius: 0,
                    data: [
                        data.map(d => d.angulo_ombro_esquerdo), data.map(d => d.angulo_ombro_direito),
                        data.map(d => d.angulo_quadril_esquerdo), data.map(d => d.angulo_quadril_direito),
                        data.map(d => d.angulo_joelho_esquerdo), data.map(d => d.angulo_joelho_direito)
                    ]
                }]
            };
            createChartCard('chartBoxplot', 'Box Plot Articular', 'distribuicoes');
            new Chart('chartBoxplot', { type: 'boxplot', data: boxplotData, options: { responsive: true, maintainAspectRatio: false, legend: { display: false } } });
            document.getElementById('export-chartBoxplot').onclick = () => {
                const quartiles = (arr) => { arr.sort((a,b)=>a-b); const mid=Math.floor(arr.length/2); return [arr[0], arr[Math.floor(mid/2)], arr[mid], arr[Math.floor(mid+arr.length)/2], arr[arr.length-1]]; };
                const exportData = boxplotData.labels.map((label, i) => { const [min, q1, median, q3, max] = quartiles(boxplotData.datasets[0].data[i]); return { articulacao: label, min, q1, median, q3, max }; });
                exportToCSV(exportData, 'boxplot_articular.csv');
            };
        }

        // ===================================
        // LÓGICA PRINCIPAL DO DASHBOARD
        // ===================================

        document.addEventListener('DOMContentLoaded', () => {
            const { timestamps, data } = generateDemoData();
            fullAnalysisData = data;
            
            setupAllCharts(timestamps, data);
            lucide.createIcons();

            // Lógica das abas
            const tabs = document.querySelectorAll('.tab-button');
            const panes = document.querySelectorAll('.tab-pane');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const target = tab.getAttribute('data-tab');
                    panes.forEach(pane => {
                        pane.classList.add('hidden');
                        if (pane.id === `${target}-content`) {
                            pane.classList.remove('hidden');
                        }
                    });
                });
            });
        });

    </script>
</body>
</html>
