<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="/style.css" />
    <title>Dashboard de Análise - The Posture Lab</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="/dashboard.css" /> 

  </head>
  <body>
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/configuracoes" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>
    
    <div class="max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard de Análise Postural</h1>
            <p class="text-gray-500 mt-1" id="analysisSubtitle">Buscando dados da análise...</p>
        </header>

        <section id="video-section" class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Vídeos da Análise</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="video-container">
                 <div class="bg-white p-4 rounded-xl shadow-sm md:col-span-2">
                    <div class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center">
                        <p class="text-gray-500">Carregando vídeos...</p>
                    </div>
                </div>
            </div>
        </section>

        <div class="bg-white rounded-xl shadow-sm p-2 mb-8">
            <nav id="tabs" class="flex flex-wrap items-center justify-start space-x-2 sm:space-x-4">
                <button data-tab="angulos" class="tab-button active font-semibold py-3 px-4 border-b-2 border-transparent">Ângulos Articulares</button>
                <button data-tab="simetria" class="tab-button font-semibold py-3 px-4 border-b-2 border-transparent">Simetria Corporal</button>
                <button data-tab="temporal" class="tab-button font-semibold py-3 px-4 border-b-2 border-transparent">Análise Temporal</button>
                <button data-tab="distribuicoes" class="tab-button font-semibold py-3 px-4 border-b-2 border-transparent">Distribuições</button>
            </nav>
        </div>

        <div id="loading-indicator" class="text-center p-10">
            <h2 id="loading-title" class="text-xl font-semibold text-gray-700">Carregando e processando dados...</h2>
            <p class="text-gray-500">Isso pode demorar um pouco.</p>
        </div>

        <main id="tab-content" class="hidden">
            <div id="angulos-content" class="tab-pane grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            <div id="simetria-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            <div id="temporal-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            <div id="distribuicoes-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
        </main>
    </div>

    <footer class="footer">
      <div class="footer-links">
        <a href="#">Careers</a> | 
        <a href="#">Privacy Policy</a> | 
        <a href="#">Terms & Conditions</a>
      </div>
      <div class="copyright">
        © 2025 Analíse Postural 
      </div>
    </footer>
    <script src="/dashboard.js"></script>
</body>
</html>
