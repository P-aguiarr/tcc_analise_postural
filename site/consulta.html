<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Análise - The Posture Lab</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        :root { --primary: #4f46e5; --light: #f3f4f6; }
        body { font-family: 'Inter', sans-serif; background-color: var(--light); }
        .chart-container { position: relative; height: 350px; width: 100%; }
        .tab-button.active { color: var(--primary); border-bottom-color: var(--primary); }
        /* Adicione seus outros estilos aqui */
    </style>
</head>
<body>
    <div class="navbar"></div>
    <div class="max-w-screen-2xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Dashboard de Análise Postural</h1>
            <p class="text-gray-500 mt-1" id="analysisSubtitle">Buscando dados da análise...</p>
        </header>
        <section id="video-section" class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Vídeos da Análise</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="video-container">
                 <div class="bg-white p-4 rounded-xl shadow-sm"><div class="w-full h-48 bg-gray-200 rounded-lg flex items-center justify-center"><p class="text-gray-500">Carregando...</p></div></div>
            </div>
        </section>
        <div class="bg-white rounded-xl shadow-sm p-2 mb-8">
            <nav id="tabs" class="flex flex-wrap items-center justify-start space-x-4">
                <button data-tab="angulos" class="tab-button active font-semibold py-3 px-4 border-b-2 border-transparent">Ângulos</button>
                <button data-tab="simetria" class="tab-button font-semibold py-3 px-4 border-b-2 border-transparent">Simetria</button>
                <button data-tab="temporal" class="tab-button font-semibold py-3 px-4 border-b-2 border-transparent">Temporal</button>
            </nav>
        </div>
        <div id="loading-indicator" class="text-center p-10"><h2 class="text-xl">Carregando gráficos...</h2></div>
        <main id="tab-content" style="display: none;">
            <div id="angulos-content" class="tab-pane active grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            <div id="simetria-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            <div id="temporal-content" class="tab-pane hidden grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
        </main>
    </div>

    <script>
        const backendBaseUrl = "https://tccanalisepostural-production.up.railway.app";

        function populateUI(analysisId, hasTransversal) {
            const videoContainer = document.getElementById("video-container");
            videoContainer.innerHTML = ''; // Limpa o placeholder

            // Adiciona o vídeo frontal
            videoContainer.innerHTML += `
                <div class="bg-white p-4 rounded-xl shadow-sm">
                    <h3 class="font-bold mb-2">Plano Coronal (Frontal) com Landmarks</h3>
                    <video controls muted class="w-full rounded-lg" src="${backendBaseUrl}/api/video/${analysisId}_frontal.mp4" type="video/mp4"></video>
                </div>`;
            
            // Adiciona o vídeo transversal, se existir
            if (hasTransversal) {
                videoContainer.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm">
                        <h3 class="font-bold mb-2">Plano Transversal (Axial) com Landmarks</h3>
                        <video controls muted class="w-full rounded-lg" src="${backendBaseUrl}/api/video/${analysisId}_transversal.mp4" type="video/mp4"></video>
                    </div>`;
            }
            document.getElementById('analysisSubtitle').textContent = `Resultados da Análise ID: ${analysisId}`;
        }

        async function fetchAnalysisData(analysisId) {
            try {
                if (!analysisId) throw new Error("ID da análise não encontrado.");
                const apiUrl = `${backendBaseUrl}/api/analysis/${analysisId}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`Erro na rede: ${response.status}`);
                const apiResponse = await response.json();
                if (!apiResponse.success) throw new Error(`Erro no backend: ${apiResponse.error}`);
                return apiResponse;
            } catch (error) {
                document.getElementById('loading-indicator').innerHTML = `<h2 class="text-red-500">${error.message}</h2>`;
                return null;
            }
        }

        window.addEventListener('load', async () => {
            const params = new URLSearchParams(window.location.search);
            const analysisId = params.get('analysis_id');

            const apiResponse = await fetchAnalysisData(analysisId);
            
            if (apiResponse && apiResponse.data) {
                // Verifica se o vídeo transversal foi processado para exibi-lo
                const hasTransversal = !!apiResponse.data.temporal_data_transversal;
                populateUI(analysisId, hasTransversal);

                // Por agora, vamos plotar apenas os dados do vídeo frontal
                if (apiResponse.data.temporal_data_frontal) {
                    document.getElementById('loading-indicator').style.display = 'none';
                    document.getElementById('tab-content').style.display = 'block';
                    setupAllCharts(apiResponse.data.temporal_data_frontal);
                    if (window.lucide) lucide.createIcons();
                } else {
                     document.getElementById('loading-indicator').textContent = "Não foram gerados dados para os gráficos.";
                }
            }
            
            // Lógica das abas...
        });

        function createChartCard(id, title, category) {
            // Sua função createChartCard com o botão de exportar
        }

        function setupAllCharts(analysisData) {
            // Sua função setupAllCharts completa, com a lógica de exportar CSV para cada gráfico
            // Exemplo para um gráfico:
            createChartCard('chartQuadris', 'Ângulos dos Quadris', 'angulos');
            new Chart('chartQuadris', { /* ... */ });
            document.getElementById('export-chartQuadris').onclick = () => exportToCSV(
                analysisData.map(d => ({ 
                    tempo_s: d.tempo_segundos, 
                    quadril_esq_graus: d.angulo_quadril_esquerdo,
                    quadril_dir_graus: d.angulo_quadril_direito
                })), 
                'angulos_quadris.csv'
            );

            // Adicione aqui a criação de TODOS os seus outros gráficos:
            // - Ângulos da Coluna
            // - Assimetrias Corporais
            // - Oscilação Vertical do Quadril
        }
    </script>
</body>
</html>
