<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <title>Configurações - The Posture Lab</title>
  </head>
<body>
  <div class="landing-page">
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/configuracoes" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

    <div class="configuracoes-page">
      <form class="cadastro-form">
        <div class="form-row">
          <div class="form-group">
            <label for="altura">Altura (cm)</label>
            <div class="input-icon">
              <i class="fa fa-user"></i>
              <input type="text" id="altura" name="altura"
                     pattern="^(?:[5-9]\d|[1-2]\d{2}|300)$"
                     title="Altura deve estar entre 50 e 300 cm" required>
            </div>
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf"
                   pattern="^\d{11}$"
                   title="CPF deve ter 11 números" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">E-mail (Amil)</label>
            <div class="input-icon">
              <i class="fa fa-user"></i>
              <input type="email" id="email" name="email"
                     pattern="^[a-zA-Z0-9._%+-]+@amil\.com$"
                     title="Informe um e-mail válido da Amil" required>
            </div>
          </div>

          <div class="form-group">
            <label for="data">Data de Nascimento</label>
            <input type="date" id="data" name="data" required>
          </div>
        </div>

        <div class="roles">
          <label><input type="radio" name="role" value="usuario" required> Usuário</label>
          <label><input type="radio" name="role" value="fisioterapeuta"> Fisioterapeuta</label>
          <label><input type="radio" name="role" value="tecnico"> Técnico/Administrador</label>
        </div>

        <button type="submit" class="btn-criar">CRIAR</button>
      </form>

      <div class="side-img">
        <img src="Configuração.png" alt="Ilustração">
      </div>
    </div>
    
    <footer class="footer">
      <div class="footer-links">
        <a href="#">Careers</a> | 
        <a href="#">Privacy Policy</a> | 
        <a href="#">Terms & Conditions</a>
      </div>
      <div class="copyright">
        © 2025 Analíse Postural 
      </div>
    </footer>
    </div> </body>
</html>
