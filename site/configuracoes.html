<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/style.css" />
  <title>Login - The Posture Lab</title>
</head>
<body>
  <div class="landing-page">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>
    <!-- CONTEÚDO CONFIGURAÇÕES -->
    <div class="configuracoes-page">
      <form class="cadastro-form">
        <div class="form-row">
          <div class="form-group">
            <label for="altura">Altura</label>
            <div class="input-icon">
              <i class="fa fa-user"></i>
              <input type="text" id="altura" name="altura">
            </div>
          </div>

          <div class="form-group">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-icon">
              <i class="fa fa-user"></i>
              <input type="email" id="email" name="email">
            </div>
          </div>

          <div class="form-group">
            <label for="data">Data de Nascimento</label>
            <input type="date" id="data" name="data">
          </div>
        </div>

        <!-- Opções -->
        <div class="roles">
          <label><input type="checkbox" name="role"> Usuário</label>
          <label><input type="checkbox" name="role"> Fisioterapeuta</label>
          <label><input type="checkbox" name="role"> Técnico/Administrador</label>
        </div>

        <!-- Botão -->
        <button type="submit" class="btn-criar">CRIAR</button>
      </form>

      <!-- Imagem lateral -->
      <div class="side-img">
        <img src="Configuração.png" alt="Ilustração">
      </div>
    </div>
  </div> <!-- fecha landing-page -->
</body>
</html>
