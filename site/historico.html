<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consulta de Histórico - The Posture Lab</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8f9fa; color: #333; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    .landing-page { flex: 1; display: flex; flex-direction: column; }
    .divider { height: 1px; background-color: #e0e0e0; margin: 20px 0; }
    .container { flex: 1; max-width: 600px; margin: 40px auto; padding: 0 20px; width: 100%; }
    .search-section, .results-section { background-color: white; border-radius: 10px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .search-title, .results-title { color: #2c3e50; margin-bottom: 20px; text-align: center; }
    .input-group { margin-bottom: 25px; }
    .input-label { display: block; margin-bottom: 8px; color: #7f8c8d; font-weight: 500; }
    .email-input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; transition: border-color 0.3s; }
    .email-input:focus { border-color: #3498db; outline: none; }
    .search-button { background-color: #3498db; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-weight: 500; width: 100%; font-size: 1rem; transition: background-color 0.3s; }
    .search-button:hover { background-color: #2980b9; }
    .no-results { text-align: center; color: #7f8c8d; padding: 20px 0; }
    .history-item { border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .history-date { color: #3498db; font-weight: 500; margin-bottom: 10px; }
    .history-details { color: #7f8c8d; }
    .footer { background-color: white; padding: 30px 20px; text-align: center; margin-top: auto; border-top: 1px solid #e0e0e0; }
    .footer-links { margin-bottom: 15px; }
    .footer-links a { color: #3498db; text-decoration: none; margin: 0 10px; }
    .footer-links a:hover { text-decoration: underline; }
    .copyright { font-size: 0.9rem; color: #7f8c8d; }
    .loading { display: none; text-align: center; margin: 20px 0; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .error-message { color: #e74c3c; text-align: center; padding: 10px; background-color: #fdedec; border-radius: 5px; margin-top: 15px; display: none; }
    @media (max-width: 768px) { .container { margin: 20px auto; } .search-section, .results-section { padding: 20px; } }
  </style>
</head>
<body>
  <div class="landing-page">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab"><span class="text-wrapper">The Posture </span><span class="span">Lab</span></p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container">
      <div class="search-section">
        <h2 class="search-title">Consulta de Histórico</h2>
        <div class="input-group">
          <label for="email" class="input-label">E-mail do paciente</label>
          <input type="email" id="email" class="email-input" placeholder="exemplo@email.com">
        </div>
        <button id="search-button" class="search-button">ACESSAR</button>
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Buscando informações...</p>
        </div>
        <div id="error-message" class="error-message"></div>
      </div>

      <div id="results-section" class="results-section">
        <h3 class="results-title">Histórico do Paciente</h3>
        <div id="results-content"></div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- FOOTER -->
    <div class="footer">
      <div class="footer-links">
        <a href="#">Careers</a> | 
        <a href="#">Privacy Policy</a> | 
        <a href="#">Terms & Conditions</a>
      </div>
      <div class="copyright">© 2025 Andilse Postural LTDA</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const API_URL = '/api/check-patient-history'; // relativo, funciona local e no Vercel

      const searchButton = document.getElementById('search-button');
      const emailInput = document.getElementById('email');
      const resultsSection = document.getElementById('results-section');
      const resultsContent = document.getElementById('results-content');
      const loadingElement = document.getElementById('loading');
      const errorMessage = document.getElementById('error-message');

      async function searchInVercelStorage(email) {
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          let data;
          try {
            data = await response.json();
          } catch (e) {
            const text = await response.text();
            throw new Error('Resposta inválida do servidor: ' + text.substring(0, 200));
          }

          if (!response.ok) throw new Error(data.error || 'Erro ao buscar informações');
          return data;
        } catch (error) {
          console.error('Erro ao buscar no storage:', error);
          throw error;
        }
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
      }

      searchButton.addEventListener('click', async function() {
        const email = emailInput.value.trim();
        errorMessage.style.display = 'none';
        resultsSection.style.display = 'none';
        resultsContent.innerHTML = '';

        if (!email) return showError('Por favor, informe o e-mail do paciente.');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('Por favor, informe um e-mail válido.');

        loadingElement.style.display = 'block';

        try {
          const result = await searchInVercelStorage(email);
          loadingElement.style.display = 'none';

          if (result.success && result.found) {
            resultsSection.style.display = 'block';
            resultsContent.innerHTML = result.history.length
              ? result.history.map(h => `
                  <div class="history-item">
                    <div class="history-date">${h.date || 'Sem data'}</div>
                    <div class="history-details">${h.details || 'Sem detalhes'}</div>
                  </div>
                `).join('')
              : '<p class="no-results">Nenhum histórico encontrado para este paciente.</p>';
          } else {
            showError(result.error || 'Este e-mail não está cadastrado na base de dados.');
          }
        } catch (error) {
          loadingElement.style.display = 'none';
          showError(error.message || 'Erro ao buscar informações. Tente novamente.');
        }
      });

      emailInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') searchButton.click();
      });
    });
  </script>
</body>
</html>
