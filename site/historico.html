<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/style.css" />
  <title>Login - The Posture Lab</title>
</head>
<body>
  <div class="landing-page">
    <!-- NAVBAR -->
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab">
          <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

      <div class="overlap-group">
        <div class="login">
          <div class="username">
            <img class="line" src="img/line-1.png" />
            <div class="user">
              <img class="icon" src="img/icon.png" />
            </div>
            <div class="text-wrapper-4">E-mail do paciente</div>
          </div>

          <div class="footer">
            <button class="button">
              <button class="button-2">ACESSAR</button>
            </button>
          </div>
        </div>

        <div class="login-2">
          <div class="username-2">
            <img class="img" src="img/image.png" />
            <div class="icon-wrapper">
              <img class="icon" src="img/icon-2.png" />
            </div>
          </div>

          <div class="button-wrapper">
            <button class="button">
              <button class="button-2">ACESSAR</button>
            </button>
          </div>
        </div>

        <img class="profile" src="img/profile.png" />
        <div class="button-3"></div>
        <p class="p">© 2025 Análise Postural LTDA</p>

        <div class="group">
          <img class="line-2" src="img/line-11.svg" />
          <img class="line-3" src="img/line-12.svg" />
          <div class="text-wrapper-5">Careers</div>
          <div class="text-wrapper-6">Privacy Policy</div>
          <div class="terms-conditions">Terms & Conditions</div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
