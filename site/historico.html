<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/style.css" />
  <title>Consulta de Histórico - The Posture Lab</title>
  <link rel="stylesheet" href="/history.css" />
</head>
<body>
  <div class="landing-page">
    <div class="navbar">
      <div class="frame-16">
        <p class="the-posture-lab"><span class="text-wrapper">The Posture </span> <span class="span">Lab</span></p>
        <div class="frame-17">
          <a href="/" class="text-wrapper-26">Home</a>
          <a href="/login" class="text-wrapper-26">Login</a>
          <a href="/configuracoes" class="text-wrapper-26">Configurações</a>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="container">
      <div class="search-section">
        <h2 class="search-title">Consulta de Histórico</h2>
        <div class="input-group">
          <label for="email" class="input-label">E-mail do paciente</label>
          <input type="email" id="email" class="email-input" placeholder="exemplo@email.com">
        </div>
        <button id="search-button" class="search-button">ACESSAR</button>
        
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Buscando informações...</p>
        </div>
        
        <div id="error-message" class="error-message"></div>
      </div>

      <div id="results-section" class="results-section">
        <h3 class="results-title">Histórico do Paciente</h3>
        <div id="results-content"></div>
      </div>
    </div>

    <div class="divider"></div>

    <footer class="footer">
      <div class="footer-links">
        <a href="#">Careers</a> | 
        <a href="#">Privacy Policy</a> | 
        <a href="#">Terms & Conditions</a>
      </div>
      <div class="copyright">
        © 2025 Analíse Postural 
      </div>
    </footer>
    </div>

  <script src="/history.js"></script>
</body>
</html>
