<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <link rel="stylesheet" href="globals.css" />
    <link rel="stylesheet" href="styleguide.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <!-- Adicione esta navbar no início do body da review.html -->
    <div class="navbar">
    <div class="frame-16">
        <p class="the-posture-lab">
        <span class="text-wrapper">The Posture </span> <span class="span">Lab</span>
        </p>
        <div class="frame-17">
        <a href="/index.html" class="text-wrapper-26">Home</a>
        <a href="/review.html" class="text-wrapper-26">Review</a>
        </div>
    </div>
    </div>
    <div class="plugin-file-cover">
      <div class="div">
        <div class="overlap">
          <div class="rectangle"></div>
          <div class="frame">
            <div class="ant-design-cloud">
              <div class="overlap-group">
                <img class="vector" src="img/nuvem.png" />
              </div>
            </div>
            <div class="text-wrapper">Arrastar e soltar aqui</div>
            <div class="div-wrapper"><div class="text-wrapper-2">ou</div></div>
            <div class="frame-2" id="fileSelector">
              <div class="text-wrapper-3">Selecione o arquivo</div>
            </div>
            <div id="fileNameDisplay" class="file-name"></div>
            <div id="errorMessage" class="error-message"></div>
            <input type="file" id="fileInput" class="hidden-file-input" accept=".mp4" />
          </div>
          <p class="arrastar-e-larga">Arrastar e soltar +&nbsp;&nbsp;Carregamento de arquivo (apenas .mp4)</p>
        </div>
        <div class="drag-drop" id="dropZone"></div>
        <div class="file-upload"><div class="text-wrapper-4">UPLOAD FILE</div></div>
        
        <!-- Seção de login (se ainda necessária) -->
        <div class="login">
          <div class="username">
            <img class="line" src="img/Line 1.png" />
            <img class="user" src="img/Icon.png" />
            <div class="text-wrapper-7">Identificador</div>
          </div>
          <footer class="footer">
            <button class="button"><button class="button-2">LOGIN</button></button>
          </footer>
        </div>
      </div>
    </div>

    <script>
      // Elementos DOM
      const fileSelector = document.getElementById('fileSelector');
      const fileInput = document.getElementById('fileInput');
      const dropZone = document.getElementById('dropZone');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const errorMessage = document.getElementById('errorMessage');

      // Seleção de arquivo ao clicar
      fileSelector.addEventListener('click', () => fileInput.click());

      // Configuração para aceitar apenas MP4
      fileInput.setAttribute('accept', '.mp4');

      // Drag and Drop
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      // Efeitos visuais durante o drag
      ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('highlight'));
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('highlight'));
      });

      // Manipular arquivos soltos
      dropZone.addEventListener('drop', handleDrop, false);

      function handleDrop(e) {
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          validateFile(files[0]);
        }
      }

      // Manipular arquivos selecionados
      fileInput.addEventListener('change', function() {
        if (this.files.length > 0) {
          validateFile(this.files[0]);
        }
      });

      // Validar se o arquivo é MP4
      function validateFile(file) {
        errorMessage.textContent = '';
        fileNameDisplay.textContent = '';
        
        // Verificar extensão do arquivo
        const validExtensions = ['.mp4'];
        const fileExtension = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
        
        if (!validExtensions.includes(fileExtension)) {
          errorMessage.textContent = 'Erro: Apenas arquivos MP4 são permitidos';
          fileInput.value = ''; // Limpa a seleção
          return false;
        }
        
        // Verificar tipo MIME (opcional, mas recomendado)
        if (!file.type.match('video/mp4')) {
          errorMessage.textContent = 'Erro: O arquivo não é um MP4 válido';
          fileInput.value = ''; // Limpa a seleção
          return false;
        }
        
        // Arquivo válido
        updateFileName(file);
        return true;
      }

      // Atualizar o nome do arquivo
      function updateFileName(file) {
        fileNameDisplay.textContent = `Arquivo selecionado: ${file.name}`;
        // Aqui você pode adicionar a lógica para preparar o upload
      }
    </script>
  </body>
</html>
